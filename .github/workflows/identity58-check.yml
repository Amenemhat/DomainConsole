name: Identity repair isolated checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'DomainConsole-CSharp/Console/IdentityRepair58.cs'
      - '.github/tests/identity-repair58.ps1'
      - '.github/workflows/identity58-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise exact repair body without Windows service or registry changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source=[IO.File]::ReadAllText((Join-Path $pwd 'DomainConsole-CSharp/Console/IdentityRepair58.cs'))
          $match=[regex]::Match($source,'public const string IdentityRepairBody58="""\r?\n(?<body>[\s\S]*?)\r?\n""";')
          if(!$match.Success){throw 'Repair body not found'}
          $folder=Join-Path $env:RUNNER_TEMP 'identity58-exact-body'
          New-Item $folder -ItemType Directory -Force|Out-Null
          $prefix='$dcExpectedId58=''22222222-2222-2222-2222-222222222222'';$dcExpectedMachine58=''11111111-1111-1111-1111-111111111111'';$dcExpectedName58=''fixture.invalid'';$dcExpectedServer58=''http://wsus.invalid:8530'';'
          [IO.File]::WriteAllText((Join-Path $folder 'identity-repair58.ps1'),$prefix+$match.Groups['body'].Value,(New-Object Text.UTF8Encoding($true)))
          & ./.github/tests/identity-repair58.ps1 -ScriptFolder $folder
