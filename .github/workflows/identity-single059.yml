name: Diagnose one remote WSUS client
on:
  push:
    branches: ['lab/0.59-identity-single']
permissions:
  contents: read
jobs:
  one-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DC_SINGLE_IDENTITY: '1'
      DC_SINGLE_NATURAL_ONLY: '1'
      DC_SINGLE_OWN_WUA_PROCESS: '1'
      APP_COMMIT: 3b1996040eda901ade8de64424b26f4cb79fa80a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_COMMIT }}
          path: _app
          persist-credentials: false
      - name: Start private Windows lab with one client
        run: bash .github/lab/prepare-guests.sh
      - name: Verify the isolated WSUS server
        run: bash .github/lab/wait-for-guests.sh wsus 55
      - name: Check one reset and a fresh report for the new ID
        run: bash .github/lab/wait-for-guests.sh single-identity 35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-wsus-client
          path: ${{ runner.temp }}/dc-wsus-lab/evidence.json
          if-no-files-found: warn
