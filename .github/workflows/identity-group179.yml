name: Verify DomainConsole 0.59 on five isolated WSUS clients
on:
  push:
    branches: ['lab/0.59-identity']
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      APP_COMMIT: 347d3ee4b3ad46995ff9e87d2fa6ec45cb78c820
      APP_RUN: '45817884316'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_COMMIT }}
          path: _app
          persist-credentials: false
      - name: Verify and download the exact Windows build of 0.59
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if build=$(timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APP_RUN") &&
               jq -e '.status=="completed"' <<<"$build" >/dev/null; then
              break
            fi
            sleep 15
          done
          jq -e --arg sha "$APP_COMMIT" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha==$sha and .head_repository.full_name==$repo and .status=="completed" and .conclusion=="success"
            and (.path|split("@")[0])==".github/workflows/build-windows.yml"' <<<"$build" >/dev/null ||
            { echo "Source Windows run $APP_RUN did not match the successful candidate." >&2; exit 1; }
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APP_RUN/artifacts" |
            jq -ec '[.artifacts[] | select(.name=="DomainConsole-Windows-x64" and .expired==false)] |
              if length==1 then .[0] else error("Expected one current Windows package") end')
          APP_ARTIFACT=$(jq -er '.id' <<<"$artifact")
          APP_DIGEST=$(jq -er '.digest | sub("^sha256:"; "")' <<<"$artifact")
          [[ "$APP_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APP_ARTIFACT" |
            jq -e --arg digest "sha256:$APP_DIGEST" --argjson run "$APP_RUN" '
              .name=="DomainConsole-Windows-x64" and .digest==$digest and .workflow_run.id==$run and .expired==false' >/dev/null ||
            { echo "Source Windows artifact $APP_ARTIFACT did not match its run and SHA-256." >&2; exit 1; }
          lab="$RUNNER_TEMP/dc-wsus-lab"
          mkdir -p "$lab"
          for attempt in 1 2 3; do
            if timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APP_ARTIFACT/zip" > "$lab/package.zip.tmp"; then
              mv "$lab/package.zip.tmp" "$lab/package.zip"
              break
            fi
            echo "Artifact download attempt $attempt failed." >&2
            sleep 5
          done
          test -s "$lab/package.zip"
          echo "$APP_DIGEST  $lab/package.zip" | sha256sum -c
          unzip -tqq "$lab/package.zip"
          jq -n --arg commit "$APP_COMMIT" --arg run "$APP_RUN" --arg artifact "$APP_ARTIFACT" --arg sha256 "$APP_DIGEST" '{commit:$commit,run:$run,artifact:$artifact,sha256:$sha256}' > "$lab/package.json.tmp"
          cp -r .github/tests/domain-scenario "$lab/scenario-1"
          git rev-parse HEAD:.github/tests/domain-scenario > "$lab/scenario-1.tree"
          mv "$lab/package.json.tmp" "$lab/package.json"
      - name: Prepare private network and Windows VMs
        run: bash .github/lab/prepare-guests.sh
      - name: Personalize independent Windows disks
        run: bash .github/lab/wait-for-guests.sh specialized 100
      - name: Verify the Active Directory lab
        run: bash .github/lab/wait-for-guests.sh domain 55
      - name: Verify the WSUS server
        run: bash .github/lab/wait-for-guests.sh wsus 45
      - name: Check four initial repairs, the returning fifth client and all WSUS registrations
        run: |
          bash .github/lab/wait-for-guests.sh attempt-1 85
          jq -e '.passed==true' "$RUNNER_TEMP/dc-wsus-lab/attempt-1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-identity-059
          path: |
            ${{ runner.temp }}/dc-wsus-lab/attempt-1.json
            ${{ runner.temp }}/dc-wsus-lab/evidence.json
          if-no-files-found: warn
