name: Isolated Windows and WSUS lab
on:
  workflow_dispatch:
  push:
    branches: ['lab/0.57-wsus']
    paths: ['.github/lab/**', '.github/workflows/wsus-lab.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: wsus-lab-057
  cancel-in-progress: true
jobs:
  stop:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stop-domain-lab]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Full domain run stopped on request."
  guests:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[stop-domain-lab]')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Check virtualization and official evaluation media
        run: |
          set -eu
          sudo test -c /dev/kvm
          df -h / /mnt
          url='https://go.microsoft.com/fwlink/p/?clcid=0x409&country=us&culture=en-us&linkid=2195166'
          curl --fail --location --retry 2 --max-time 80 --range 0-511 --max-filesize 1048576 "$url" -o "$RUNNER_TEMP/vhd-header" -w 'HTTP %{http_code} %{url_effective}\n'
          file "$RUNNER_TEMP/vhd-header"
      - name: Prepare host-only switch, base Windows disk and signed NIC drivers
        run: bash .github/lab/prepare-guests.sh
      - name: Personalize seven independent Windows system disks
        run: bash .github/lab/wait-for-guests.sh disks 30
      - name: Finish Windows setup on each disk with full guest resources
        run: bash .github/lab/wait-for-guests.sh specialized 100
      - name: Boot seven Windows guests and validate their independent WinRM sessions
        run: bash .github/lab/wait-for-guests.sh winrm 80
      - name: Promote the domain controller and join two OUs
        run: bash .github/lab/wait-for-guests.sh domain 40
      - name: Install WSUS and verify its administrative endpoint
        run: bash .github/lab/wait-for-guests.sh wsus 40
      - name: Read candidate revision
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/testing/candidate-0.57.sha?ref=lab/0.57-wsus" --jq .content | base64 -d)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.package.outputs.sha }}
          path: _app
          persist-credentials: false
      - name: Verify packaged Windows build and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/lab/fetch-package.sh
      - name: Test five real registrations and one real reboot (attempt 1)
        id: scenario1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/lab/drive-scenario.sh 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.scenario1.outcome != 'skipped'
        with:
          name: isolated-domain-attempt-1
          path: ${{ runner.temp }}/dc-wsus-lab/attempt-1.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test five real registrations and one real reboot (attempt 2)
        id: scenario2
        if: steps.scenario1.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/lab/drive-scenario.sh 2
      - uses: actions/upload-artifact@v4
        if: always() && steps.scenario2.outcome != 'skipped'
        with:
          name: isolated-domain-attempt-2
          path: ${{ runner.temp }}/dc-wsus-lab/attempt-2.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test five real registrations and one real reboot (attempt 3)
        id: scenario3
        if: steps.scenario2.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/lab/drive-scenario.sh 3
      - uses: actions/upload-artifact@v4
        if: always() && steps.scenario3.outcome != 'skipped'
        with:
          name: isolated-domain-attempt-3
          path: ${{ runner.temp }}/dc-wsus-lab/attempt-3.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require an independently verified five-client outcome
        if: always()
        run: |
          test "${{ steps.scenario1.outcome }}" = success || test "${{ steps.scenario2.outcome }}" = success || test "${{ steps.scenario3.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-wsus-evidence
          path: |
            ${{ runner.temp }}/dc-wsus-lab/evidence.json
            ${{ runner.temp }}/dc-wsus-lab/*-boot.png
          if-no-files-found: warn
          retention-days: 7
