name: Publish verified release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-request.json'
      - '.github/workflows/publish-release.yml'
      - '.github/scripts/publish_release.py'
      - '.github/scripts/test_publish_release.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: domainconsole-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication guards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate or publish the exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_release.py
