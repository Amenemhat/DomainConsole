name: Publish 0.59 RC 1 after Windows CI
on:
  push:
    branches: ['release/0.59.0-rc.1']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: domainconsole-059-rc1
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release/0.59.0-rc.1'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: '1df2700a8ac451f5db08ede6223730552a1faab1'
      SOURCE_RUN: '45597889123'
      PACKAGE_SHA: '86a2ce2f29894e94ae9b661c72dbdaa59ce98c30848abbf2b52c47e0d368ed47'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and package, then publish a non-latest prerelease
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          tag=v0.59.0-rc.1
          zip=DomainConsole-0.59.0-rc.1-Windows-x64.zip
          notes=docs/releases/0.59.0-rc.1.md
          for attempt in $(seq 1 36); do
            gh api "$repo/actions/runs/$SOURCE_RUN" > build.json
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_branch=="work/0.59-candidate" and .event=="push" and .head_repository.full_name==$repo and (.path|split("@")[0])==".github/workflows/build-windows.yml"' build.json >/dev/null
            if jq -e '.status=="completed"' build.json >/dev/null; then break; fi
            sleep 40
          done
          jq -e '.status=="completed" and .conclusion=="success"' build.json >/dev/null
          gh api "$repo/actions/runs/$SOURCE_RUN/artifacts" |
            jq -e '[.artifacts[]|select(.name=="DomainConsole-Windows-x64" and .expired==false)]|select(length==1)|.[0]' > artifact.json
          ARTIFACT_ID=$(jq -r '.id' artifact.json)
          ZIP_SHA256=$(jq -r '.digest|sub("^sha256:";"")|select(test("^[0-9a-f]{64}$"))' artifact.json)
          test "$ZIP_SHA256" = "$PACKAGE_SHA"
          test "$ARTIFACT_ID" = 15016081138
          gh api "$repo/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg digest "sha256:$ZIP_SHA256" --argjson run "$SOURCE_RUN" '.expired==false and .name=="DomainConsole-Windows-x64" and .digest==$digest and .workflow_run.id==$run' >/dev/null
          gh api "$repo/actions/artifacts/$ARTIFACT_ID/zip" > "$zip"
          PYTHONPATH=.github/scripts python3 -c 'import sys; from pathlib import Path; from publish_release import validate_package; validate_package(Path(sys.argv[1]).read_bytes(), sys.argv[2])' "$zip" "$ZIP_SHA256"
          printf '%s  %s\n' "$ZIP_SHA256" "$zip" > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets |
              jq -e --arg zip "$zip" '.isPrerelease and (.assets|map(.name)|sort)==([$zip,"SHA256SUMS.txt"]|sort)' >/dev/null
          else
            gh release create "$tag" "$zip" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "DomainConsole 0.59.0 RC 1" --notes-file "$notes" --draft --prerelease --latest=false
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
          gh api "$repo/git/ref/tags/$tag" | jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          gh api "$repo/releases/tags/$tag" | jq -e --arg name "$zip" --arg digest "sha256:$PACKAGE_SHA" '
            .draft==false and .prerelease==true and
            ([.assets[]|select(.name==$name and .digest==$digest and .state=="uploaded")]|length)==1' >/dev/null
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url
