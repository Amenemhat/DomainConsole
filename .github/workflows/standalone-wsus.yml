name: Verify one real WSUS registration
on:
  workflow_dispatch:
  push:
    branches: ['lab/0.57-wsus']
    paths: ['docs/testing/standalone-wsus.sha','.github/tests/standalone-wsus.ps1','.github/workflows/standalone-wsus.yml']
permissions:
  contents: read
jobs:
  registration:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read exact application revision
        id: candidate
        shell: pwsh
        run: |
          $source=(Get-Content docs/testing/standalone-wsus.sha -Raw).Trim()
          if($source -notmatch '^[a-f0-9]{40}$'){throw 'Invalid revision'}
          "sha=$source" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: _app
          persist-credentials: false
      - name: Install local WSUS, configure only this disposable Windows client
        shell: powershell
        run: ./.github/lab/wsus.ps1
      - name: Verify the exact product repair against Windows Update and WSUS
        shell: powershell
        run: ./.github/tests/standalone-wsus.ps1
