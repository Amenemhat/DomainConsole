name: Build Windows application
on:
  workflow_dispatch:
  push:
    paths:
      - 'DomainConsole-CSharp/**'
      - 'docs/error-reference/**'
      - 'DomainConsole-Source.zip'
      - '.github/workflows/build-windows.yml'
      - '.github/scripts/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release acceptance and publication guards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify error reference data and reproducibility
        shell: pwsh
        run: |
          python -m unittest discover -s docs/error-reference -p test_reference.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Reference validation failed' }
          python docs/error-reference/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Reference rebuild failed' }
          git diff --exit-code -- docs/error-reference/catalog.json docs/error-reference/REFERENCE.ru.md docs/error-reference/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Reference generated files differ' }
      - name: Build native C# remote executor
        run: dotnet build DomainConsole-CSharp/Agent/DomainConsole.Agent.csproj -c Release
      - name: Publish portable Windows app
        run: dotnet publish DomainConsole-CSharp/Console/DomainConsole.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Publish
      - name: Include remote executor
        shell: pwsh
        run: |
          New-Item Publish/Agent -ItemType Directory -Force | Out-Null
          Copy-Item DomainConsole-CSharp/Agent/bin/Release/net462/DomainConsole.Agent.exe Publish/Agent/
          Copy-Item DomainConsole-CSharp/README.txt Publish/README-source.txt
      - name: Verify window and history after restart
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_UI_SMOKE = '1'
          $env:TEMP = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $env:TMP = $env:TEMP
          New-Item $env:TEMP -ItemType Directory -Force | Out-Null
          function Test-Window {
            Remove-Item Publish/ui-smoke-ready.txt -Force -ErrorAction SilentlyContinue
            $p = Start-Process ./Publish/DomainConsole.exe -PassThru
            $until = [DateTime]::UtcNow.AddSeconds(240)
            while (!(Test-Path Publish/ui-smoke-ready.txt) -and !$p.HasExited -and [DateTime]::UtcNow -lt $until) { Start-Sleep -Milliseconds 200; $p.Refresh() }
            if (!$p.HasExited -and !(Test-Path Publish/ui-smoke-ready.txt)) { Stop-Process -Id $p.Id; throw 'UI assertions did not finish within 240 seconds' }
            $p.Refresh()
            if ($p.HasExited) { if (Test-Path Publish/smoke-error.txt) { Get-Content Publish/smoke-error.txt }; throw "Application exited during startup: $($p.ExitCode)" }
            if ($p.MainWindowHandle -eq 0) { Stop-Process -Id $p.Id; throw "Application window was not created" }
            Write-Output "Window created: $($p.MainWindowTitle)"
            $null = $p.CloseMainWindow()
            if (!$p.WaitForExit(10000)) { Stop-Process -Id $p.Id; throw "Application did not close normally" }
            if ($p.ExitCode -ne 0) { if (Test-Path Publish/smoke-error.txt) { Get-Content Publish/smoke-error.txt }; throw "Application exited with code $($p.ExitCode)" }
          }
          Test-Window
          $env:DOMAINCONSOLE_EXPECT_HISTORY = '1'
          Test-Window
          Remove-Item Publish/ui-smoke-ready.txt -Force
          Remove-Item Publish/Data -Recurse -Force
          Write-Output "History persisted, opened without network, and survived AD list refresh."
      - name: Parse generated collector scripts before execution
        shell: pwsh
        run: |
          foreach($file in Get-ChildItem (Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke') -Filter '*.ps1'|Where-Object {$_.Name -like 'probe42-*' -or $_.Name -like 'collector43-*'}){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors){throw ($file.Name+': '+($errors|Out-String))}
          }
      - name: Verify persisted master OFF before startup timers
        shell: pwsh
        run: |
          New-Item Publish/Data -ItemType Directory -Force|Out-Null
          Set-Content Publish/Data/poll-paused41.json 'true'
          Set-Content Publish/Data/computers.json '[{"Name":"PAUSE-FIXTURE","Host":"pause43.invalid","OS":"Windows test"}]'
          Set-Content Publish/Data/wsus-settings.json '{"Host":"wsus43.invalid","Port":8530}'
          Remove-Item Publish/poll-network43.txt -ErrorAction SilentlyContinue
          $env:DOMAINCONSOLE_PAUSE_SMOKE43='1'
          $p=Start-Process ./Publish/DomainConsole.exe -PassThru
          try {
            Start-Sleep -Seconds 15
            $p.Refresh()
            if($p.HasExited){throw 'Paused application exited unexpectedly'}
            if(Test-Path Publish/poll-network43.txt){throw 'Persisted OFF started a PowerShell transport'}
            $null=$p.CloseMainWindow()
            if(!$p.WaitForExit(10000)){throw 'Paused app failed to close'}
            if(!(Get-Content Publish/Data/poll-paused41.json -Raw|ConvertFrom-Json)){throw 'OFF setting lost'}
          }finally{if(!$p.HasExited){Stop-Process $p.Id};Remove-Item Env:DOMAINCONSOLE_PAUSE_SMOKE43 -ErrorAction SilentlyContinue;Remove-Item Publish/Data -Recurse -Force}
          Write-Output 'Normal startup with persisted OFF: timers run, zero PowerShell transports, state preserved.'
      - name: Verify local SYSTEM execution and logs
        shell: pwsh
        run: |
          $p = Start-Process ./Publish/DomainConsole.exe -ArgumentList 'local-smoke' -PassThru
          if (!$p.WaitForExit(90000)) { Stop-Process -Id $p.Id; throw 'Local transport timeout' }
          if ($p.ExitCode -ne 0 -or !(Test-Path Publish/local-smoke-ok.txt)) { if (Test-Path Publish/local-smoke-error.txt) { Get-Content Publish/local-smoke-error.txt }; throw 'Local transport failed' }
          Get-Content Publish/local-smoke-ok.txt
          Remove-Item Publish/local-smoke-*.txt
          Remove-Item Publish/Data -Recurse -Force -ErrorAction SilentlyContinue
      - name: Verify update progress and cancellation
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe update-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-update-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Update operation fixture failed" }
      - name: Verify cross-console ownership and native interactive session reader
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe coordination-smoke37 (Join-Path $env:RUNNER_TEMP 'DomainConsole-coordination37')
          if ($LASTEXITCODE -ne 0) { throw 'Cross-console ownership fixture failed' }
          $probe = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/user-probe37.ps1'
          $value = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $probe | ConvertFrom-Json
          if (!$value.Complete) { throw 'Native WTS session reader did not complete' }
          Write-Output 'Native session enumeration succeeded; no user identifiers are exported.'
      - name: Verify parallel command and WSUS queues
        shell: pwsh
        run: |
          $folders=@();$processes=@()
          try {
            foreach($channel in @('WSUS','Commands')){
              $folder=Join-Path $env:RUNNER_TEMP ('DomainConsole-lane-'+$channel)
              New-Item $folder -ItemType Directory -Force | Out-Null
              $code=if($channel -eq 'WSUS'){'ping -n 16 127.0.0.1 > nul'}else{'echo PARALLEL_OK'}
              @{Id=[Guid]::NewGuid().ToString();OutputChannel=$channel;Steps=@(@{Name='lane fixture';Kind='CMD';Code=$code})}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
              $processes+=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList ('run "'+$folder+'"') -PassThru
              $folders+=$folder
              if($channel -eq 'WSUS'){
                $ready=$false
                for($i=0;$i -lt 40;$i++){Start-Sleep -Milliseconds 250;try{$st=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json;if($st.Status -eq 'Running' -and $st.ProcessId){$ready=$true;break}}catch{}}
                if(!$ready){throw 'WSUS lane fixture did not start'}
              }
            }
            if(!$processes[1].WaitForExit(7000)){throw 'Command lane blocked by WSUS'}
            $st=Get-Content (Join-Path $folders[1] 'status.json') -Raw|ConvertFrom-Json
            if($st.Status -ne 'Completed' -or $processes[0].HasExited){throw 'Parallel lane result invalid'}
            New-Item (Join-Path $folders[0] 'stop-now.flag') -ItemType File|Out-Null
            if(!$processes[0].WaitForExit(10000)){throw 'WSUS fixture cancellation failed'}
          } finally {foreach($p in $processes){if(!$p.HasExited){Stop-Process -Id $p.Id -Force}}}
      - name: Verify independent control lane and cancellation of waiting commands
        shell: pwsh
        run: |
          $folders=@();$processes=@()
          try {
            foreach($kind in @('long','waiting','control')){
              $folder=Join-Path $env:RUNNER_TEMP ('DomainConsole-command-lane-'+$kind)
              New-Item $folder -ItemType Directory -Force|Out-Null
              $code=if($kind -eq 'long'){'ping -n 61 127.0.0.1 > nul'}else{'echo CONTROL_FIXTURE'}
              @{Id=[guid]::NewGuid().ToString();OutputChannel='Commands';IndependentControl=($kind -eq 'control');Steps=@(@{Kind='CMD';Name=$kind;Code=$code})}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
              $p=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList ('run "'+$folder+'"') -PassThru
              $processes+=$p;$folders+=$folder
              if($kind -eq 'long'){
                $ready=$false
                for($i=0;$i -lt 60;$i++){Start-Sleep -Milliseconds 200;try{$st=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json;if($st.ProcessId){$ready=$true;break}}catch{}}
                if(!$ready){throw 'Long command did not start'}
              }
            }
            if(!$processes[2].WaitForExit(8000)){throw 'Independent control blocked behind command lane'}
            if($processes[0].HasExited -or $processes[1].HasExited){throw 'Ordinary queue isolation failed'}
            New-Item (Join-Path $folders[1] 'stop-now.flag') -ItemType File|Out-Null
            if(!$processes[1].WaitForExit(8000)){throw 'Waiting command did not cancel'}
            $st=Get-Content (Join-Path $folders[1] 'status.json') -Raw|ConvertFrom-Json
            if($st.Status -ne 'Cancelled'){throw 'Waiting command cancellation not terminal'}
            New-Item (Join-Path $folders[0] 'stop-now.flag') -ItemType File|Out-Null
            if(!$processes[0].WaitForExit(10000)){throw 'Long command did not stop'}
          }finally{foreach($p in $processes){if(!$p.HasExited){Stop-Process -Id $p.Id -Force}}}
      - name: Verify client cleanup protection
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe cleanup-smoke (Join-Path $env:RUNNER_TEMP 'DomainConsole-cleanup-fixture')
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup protection failed' }
      - name: Verify redirected progress output
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe output-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-output-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Progress output check failed" }
      - name: Verify bounded diagnostics
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe diagnostic-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-diagnostic-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Bounded diagnostics check failed" }
      - name: Verify isolated Ctrl+C and explicit force
        shell: pwsh
        run: |
          $p=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList 'command-stop-smoke' -PassThru
          if (!$p.WaitForExit(30000)) { Stop-Process -Id $p.Id; throw 'Console cancellation fixture timeout' }
          if ($p.ExitCode -ne 0) { throw 'Isolated Ctrl+C / explicit force fixture failed' }
      - name: Verify cancelling running CMD and PowerShell jobs
        shell: pwsh
        run: |
          foreach ($kind in @('CMD','PowerShell')) {
            $folder=Join-Path $env:RUNNER_TEMP ('DomainConsole-stop-'+$kind)
            New-Item $folder -ItemType Directory -Force | Out-Null
            $code=if($kind -eq 'CMD'){'ping -n 61 127.0.0.1 > nul'}else{'Start-Sleep -Seconds 60'}
            @{Id=[guid]::NewGuid().ToString();Steps=@(@{Name='Long command';Kind=$kind;Code=$code},@{Name='Must not run';Kind='CMD';Code='echo SHOULD_NOT_RUN'})} | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $folder 'job.json') -Encoding utf8
            $p=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList @('run',('"'+$folder+'"')) -PassThru
            $until=(Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              try {$state=Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json}catch{$state=$null}
            }while((!$state.ProcessId -or !$state.SupportsImmediateStop) -and (Get-Date) -lt $until)
            if (!$state.ProcessId) { throw 'No running command process' }
            Start-Sleep -Milliseconds 750
            New-Item (Join-Path $folder 'stop-now.flag') -ItemType File -Force | Out-Null
            if (!$p.WaitForExit(8000)) {
              $state=Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json
              if($state.StopStatus -ne 'ForceRequired'){Stop-Process -Id $p.Id;throw ('Unresponsive command has no explicit force option: '+($state|ConvertTo-Json -Compress))}
              Write-Output ($kind+': Ctrl+C not accepted; testing administrator-confirmed termination of this owned command only.')
              New-Item (Join-Path $folder 'force-stop.flag') -ItemType File -Force|Out-Null
              if(!$p.WaitForExit(10000)){Stop-Process -Id $p.Id;throw 'Explicit termination did not stop owned command'}
            }
            $state=Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or $state.Status -ne 'Cancelled' -or !$state.Ended -or $state.Step -ne 1) { throw 'Cancellation did not preserve a terminal state or skipped-step semantics' }
          }
      - name: Verify command failure state
        shell: pwsh
        run: |
          foreach ($continue in @($false,$true)) {
            $folder = Join-Path $env:RUNNER_TEMP ("DomainConsole-failure-" + $continue)
            New-Item $folder -ItemType Directory -Force | Out-Null
            $job = @{Id=[guid]::NewGuid().ToString(); MicrosoftSource=$false; AutoReboot=$false; ContinueOnError=$continue; Steps=@(@{Name='Failure fixture';Kind='CMD';Code='exit /b 7'},@{Name='Next step';Kind='CMD';Code='exit /b 0'})}
            $job | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $folder 'job.json') -Encoding utf8
            & ./Publish/Agent/DomainConsole.Agent.exe run $folder
            if ($LASTEXITCODE -ne 0) { throw 'Executor failed unexpectedly' }
            $state = Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json
            $expected = if ($continue) { 'CompletedWithErrors' } else { 'Failed' }
            if ($state.Status -ne $expected -or !$state.Ended -or $state.Results[0].ExitCode -ne 7 -or $state.Error -notmatch '0x00000007') { throw 'Failure status/code/diagnosis was not saved' }
          }
          Write-Output 'Nonzero command exit is terminal; continue-on-error preserves failure diagnosis.'
      - name: Verify native program exit capture in PowerShell
        shell: pwsh
        run: |
          $folder=Join-Path $env:RUNNER_TEMP 'native-exit-fixture'
          New-Item $folder -ItemType Directory -Force|Out-Null
          @{Id=[guid]::NewGuid().ToString();MicrosoftSource=$false;AutoReboot=$false;Steps=@(@{Name='Native exit';Kind='PowerShell';Code='cmd.exe /c exit 5; Write-Output "script completed"'})}|ConvertTo-Json -Depth 10|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
          & ./Publish/Agent/DomainConsole.Agent.exe run $folder
          $state=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json
          if($state.Results[0].ExitCode -ne 0 -or $state.Results[0].NativeExitCode -ne 5){throw 'PowerShell and native exit codes were mixed or lost'}
      - name: Verify diagnostic script and time window
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'DomainConsole-diagnostic-window'
          New-Item (Join-Path $fixture 'Logs/CBS') -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $fixture 'Logs/DISM') -ItemType Directory -Force | Out-Null
          $jobFolder = Join-Path $fixture 'DomainConsoleCSharp/00000000-0000-0000-0000-000000000001'
          New-Item $jobFolder -ItemType Directory -Force | Out-Null
          @{Started=[DateTime]::UtcNow.AddMinutes(-10).ToString('o');Status='Failed';Ended=[DateTime]::UtcNow.ToString('o');Error='fixture failure';Results=@()} | ConvertTo-Json | Set-Content (Join-Path $jobFolder 'status.json') -Encoding utf8
          $old = (Get-Date).AddDays(-3).ToString('yyyy-MM-dd HH:mm:ss') + ', Error OUTSIDE_WINDOW_ERROR'
          $recent = (Get-Date).AddMinutes(-5).ToString('yyyy-MM-dd HH:mm:ss') + ', Error IN_WINDOW_ERROR'
          (@($old,$recent,'Continuation context') + @(1..10 | ForEach-Object { (Get-Date).AddMinutes(-4).ToString('yyyy-MM-dd HH:mm:ss')+', Info ordinary context' }) + @((Get-Date).AddMinutes(-4).ToString('yyyy-MM-dd HH:mm:ss')+', Info NORMAL_CBS_NOT_FOR_DISPLAY')) | Set-Content (Join-Path $fixture 'Logs/CBS/CBS.log') -Encoding utf8
          $script = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/diagnostic-script.ps1'
          $text = Get-Content $script -Raw
          $harness = @'
          $ErrorActionPreference='Stop'
          $tokens=$null;$parseErrors=$null
          $text=[IO.File]::ReadAllText($env:DOMAINCONSOLE_DIAGNOSTIC_SCRIPT)
          $null=[Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count){throw ($parseErrors|Out-String)}
          function Get-Process {param($Name,$ErrorAction) @()}
          function Get-WinEvent {param($FilterHashtable,$MaxEvents,$ErrorAction) @()}
          $env:windir=$env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE
          $env:ProgramData=$env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE
          $result=(& ([ScriptBlock]::Create($text)))|Out-String
          if($result -notmatch 'IN_WINDOW_ERROR' -or $result -match 'OUTSIDE_WINDOW_ERROR' -or $result -notmatch 'Continuation context'){throw 'Time-window/context filter failed'}
          if($result -match 'NORMAL_CBS_NOT_FOR_DISPLAY'){throw 'Full CBS leaked into short diagnostic output'}
          Write-Output 'Diagnostic script valid in Windows PowerShell 5.1; selected interval and context verified.'
          '@
          $env:DOMAINCONSOLE_DIAGNOSTIC_SCRIPT=$script
          $env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE=$fixture
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($harness)))
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic script check failed' }
      - name: Verify reporting scripts in Windows PowerShell
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_REPORT_SCRIPTS = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $check = @'
          foreach($name in @('delivery-client.ps1','delivery-server.ps1','report-recovery.ps1','cache-cleanup.ps1','force-update.ps1','defender-diagnose.ps1','defender-recover.ps1','live-updates.ps1','live-probe-wrapper.ps1','report-queue.ps1','restart-services.ps1','update-wizard.ps1','priority-control.ps1','priority-restore.ps1','download-diagnostic.ps1','cancel-job.ps1','memory-diagnostic.ps1','wsus-overview.ps1','header-reboot.ps1','reboot-state.ps1','cache-cleanup-30.ps1','reboot-system-30.ps1','automatic-queue-recovery.ps1')){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS $name),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
          Write-Output 'Reporting scripts parse in Windows PowerShell 5.1.'
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check)))
          if ($LASTEXITCODE -ne 0) { throw 'Reporting script parsing failed' }
      - name: Verify cancellation with missing status and preservation of partial results
        shell: pwsh
        run: |
          $env:DC_ORPHAN_FIXTURE=Join-Path $env:RUNNER_TEMP 'orphan-fixture'
          $env:DC_ORPHAN_SCRIPT=Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/cancel-job.ps1'
          $check=@'
          $ErrorActionPreference='Stop'
          $env:ProgramData=$env:DC_ORPHAN_FIXTURE
          $id='00000000-0000-0000-0000-000000000024';$name='DomainConsoleCSharp-'+$id
          $folder=Join-Path $env:ProgramData ('DomainConsoleCSharp/'+$id)
          New-Item $folder -ItemType Directory -Force|Out-Null
          @{Id=$id;Steps=@()}|ConvertTo-Json|Set-Content (Join-Path $folder 'job.json') -Encoding UTF8
          Set-Content (Join-Path $folder 'step-1.out') 'KEEP_PARTIAL_OUTPUT'
          $action=New-ScheduledTaskAction -Execute cmd.exe -Argument '/c exit 0'
          $principal=New-ScheduledTaskPrincipal -UserId SYSTEM -LogonType ServiceAccount -RunLevel Highest
          $script=[IO.File]::ReadAllText($env:DC_ORPHAN_SCRIPT)
          try {
            Register-ScheduledTask -TaskName $name -Action $action -Principal $principal -Force|Out-Null
            $reply=(& ([ScriptBlock]::Create($script)))|ConvertFrom-Json
            $state=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json
            if($reply.Status -ne 'Cancelled' -or $state.Status -ne 'Cancelled' -or (Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue)){throw 'Missing status cancellation did not close the exact task'}
            @{Id=$id;Status='Running';Error='PARTIAL_ERROR';Results=@(@{Name='partial';ExitCode=1});Ended=''}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $folder 'status.json') -Encoding UTF8
            $reply=(& ([ScriptBlock]::Create($script)))|ConvertFrom-Json
            $state=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json
            if($state.Results.Count -ne 1 -or $state.Error -ne 'PARTIAL_ERROR' -or (Get-Content (Join-Path $folder 'step-1.out') -Raw) -notmatch 'KEEP_PARTIAL_OUTPUT'){throw 'Cancellation discarded partial evidence'}
            Write-Output 'Exact inactive task removed; missing status handled and partial results preserved.'
          }finally{Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue}
          Write-Output 'Fixture cleanup completed.'
          exit 0
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check)))
          if($LASTEXITCODE -ne 0){throw 'Orphan cancellation fixture failed'}
      - name: Verify service restart restoration without touching real services
        shell: powershell
        run: |
          $text=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/restart-services.ps1'))
          $fixture=@{};$script:starts=New-Object 'System.Collections.Generic.List[string]';$script:failStop=$false;$script:failStart=$false
          foreach($name in @('UsoSvc','bits','fixtureDependent')){
            $s=[pscustomobject]@{Name=$name;ServiceName=$name;Status='Running';DependentServices=@()}
            $s|Add-Member ScriptMethod WaitForStatus {param($state,$timeout);$this.Status=[string]$state}
            $s|Add-Member ScriptMethod Stop {Stop-Service $this.Name -Force -ErrorAction Stop}
            $fixture[$name]=$s
          }
          $fixture['UsoSvc'].DependentServices=@($fixture['fixtureDependent'])
          function Get-Service {param([string[]]$Name);foreach($n in $Name){$fixture[$n]}}
          function Stop-Service {param($Name,[switch]$Force,$ErrorAction);if($script:failStop -and $Name -eq 'UsoSvc'){throw 'fixture stop failure'};$fixture[$Name].Status='Stopped'}
          function Start-Service {param($Name,$ErrorAction);$script:starts.Add($Name);if($script:failStart -and $Name -eq 'UsoSvc'){throw 'fixture start failure'};$fixture[$Name].Status='Running'}
          $null=& ([ScriptBlock]::Create($text))
          if(!$script:starts.Contains('fixtureDependent') -or !$script:starts.Contains('UsoSvc') -or !$script:starts.Contains('bits')){throw 'Running dependent services were not restored'}
          foreach($scenario in @('stop','start')){
            $script:starts.Clear();$script:failStop=$scenario -eq 'stop';$script:failStart=$scenario -eq 'start';$failed=$false
            try{$null=& ([ScriptBlock]::Create($text))}catch{$failed=$true}
            if(!$failed -or !$script:starts.Contains('bits')){throw 'Restore failed to continue after another service error'}
          }
          Write-Output 'Selected services and dependents restored; stop/start failures reported; no actual services modified.'
      - name: Verify legacy MRT force selection guards
        shell: powershell
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'force-selection-fixture'
