name: Build Windows application
on:
  workflow_dispatch:
  push:
    paths:
      - 'DomainConsole-CSharp/**'
      - 'DomainConsole-Source.zip'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native C# remote executor
        run: dotnet build DomainConsole-CSharp/Agent/DomainConsole.Agent.csproj -c Release
      - name: Publish portable Windows app
        run: dotnet publish DomainConsole-CSharp/Console/DomainConsole.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Publish
      - name: Include remote executor
        shell: pwsh
        run: |
          New-Item Publish/Agent -ItemType Directory -Force | Out-Null
          Copy-Item DomainConsole-CSharp/Agent/bin/Release/net462/DomainConsole.Agent.exe Publish/Agent/
          Copy-Item DomainConsole-CSharp/README.txt Publish/README-source.txt
      - name: Verify local SYSTEM execution and logs
        shell: pwsh
        run: |
          $p = Start-Process ./Publish/DomainConsole.exe -ArgumentList 'local-smoke' -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'Local transport timeout' }
          if ($p.ExitCode -ne 0 -or !(Test-Path Publish/local-smoke-ok.txt)) { if (Test-Path Publish/local-smoke-error.txt) { Get-Content Publish/local-smoke-error.txt }; throw 'Local transport failed' }
          Get-Content Publish/local-smoke-ok.txt
          Remove-Item Publish/local-smoke-*.txt
          Remove-Item Publish/Data -Recurse -Force -ErrorAction SilentlyContinue
      - name: Verify update progress and cancellation
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe update-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-update-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Update operation fixture failed" }
      - name: Verify parallel command and WSUS queues
        shell: pwsh
        run: |
          $folders=@();$processes=@()
          try {
            foreach($channel in @('WSUS','Commands')){
              $folder=Join-Path $env:RUNNER_TEMP ('DomainConsole-lane-'+$channel)
              New-Item $folder -ItemType Directory -Force | Out-Null
              $code=if($channel -eq 'WSUS'){'ping -n 16 127.0.0.1 > nul'}else{'echo PARALLEL_OK'}
              @{Id=[Guid]::NewGuid().ToString();OutputChannel=$channel;Steps=@(@{Name='lane fixture';Kind='CMD';Code=$code})}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
              $processes+=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList ('run "'+$folder+'"') -PassThru
              $folders+=$folder
              if($channel -eq 'WSUS'){
                $ready=$false
                for($i=0;$i -lt 40;$i++){Start-Sleep -Milliseconds 250;try{$st=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json;if($st.Status -eq 'Running' -and $st.ProcessId){$ready=$true;break}}catch{}}
                if(!$ready){throw 'WSUS lane fixture did not start'}
              }
            }
            if(!$processes[1].WaitForExit(7000)){throw 'Command lane blocked by WSUS'}
            $st=Get-Content (Join-Path $folders[1] 'status.json') -Raw|ConvertFrom-Json
            if($st.Status -ne 'Completed' -or $processes[0].HasExited){throw 'Parallel lane result invalid'}
            New-Item (Join-Path $folders[0] 'stop-now.flag') -ItemType File|Out-Null
            if(!$processes[0].WaitForExit(10000)){throw 'WSUS fixture cancellation failed'}
          } finally {foreach($p in $processes){if(!$p.HasExited){Stop-Process -Id $p.Id -Force}}}
      - name: Verify client cleanup protection
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe cleanup-smoke (Join-Path $env:RUNNER_TEMP 'DomainConsole-cleanup-fixture')
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup protection failed' }
      - name: Verify redirected progress output
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe output-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-output-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Progress output check failed" }
      - name: Verify bounded diagnostics
        shell: pwsh
        run: |
          & ./Publish/Agent/DomainConsole.Agent.exe diagnostic-smoke (Join-Path $env:RUNNER_TEMP "DomainConsole-diagnostic-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Bounded diagnostics check failed" }
      - name: Verify isolated Ctrl+C and explicit force
        shell: pwsh
        run: |
          $p=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList 'command-stop-smoke' -PassThru
          if (!$p.WaitForExit(30000)) { Stop-Process -Id $p.Id; throw 'Console cancellation fixture timeout' }
          if ($p.ExitCode -ne 0) { throw 'Isolated Ctrl+C / explicit force fixture failed' }
      - name: Verify cancelling running CMD and PowerShell jobs
        shell: pwsh
        run: |
          foreach ($kind in @('CMD','PowerShell')) {
            $folder=Join-Path $env:RUNNER_TEMP ('DomainConsole-stop-'+$kind)
            New-Item $folder -ItemType Directory -Force | Out-Null
            $code=if($kind -eq 'CMD'){'ping -n 61 127.0.0.1 > nul'}else{'Start-Sleep -Seconds 60'}
            @{Id=[guid]::NewGuid().ToString();Steps=@(@{Name='Long command';Kind=$kind;Code=$code},@{Name='Must not run';Kind='CMD';Code='echo SHOULD_NOT_RUN'})} | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $folder 'job.json') -Encoding utf8
            $p=Start-Process ./Publish/Agent/DomainConsole.Agent.exe -ArgumentList @('run',('"'+$folder+'"')) -PassThru
            $until=(Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              try {$state=Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json}catch{$state=$null}
            }while((!$state.ProcessId -or !$state.SupportsImmediateStop) -and (Get-Date) -lt $until)
            if (!$state.ProcessId) { throw 'No running command process' }
            Start-Sleep -Milliseconds 750
            New-Item (Join-Path $folder 'stop-now.flag') -ItemType File -Force | Out-Null
            if (!$p.WaitForExit(15000)) { Stop-Process -Id $p.Id; throw 'Running command did not cancel via Ctrl+C' }
            $state=Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or $state.Status -ne 'Cancelled' -or !$state.Ended -or $state.Step -ne 1) { throw 'Cancellation did not preserve a terminal state or skipped-step semantics' }
          }
      - name: Verify command failure state
        shell: pwsh
        run: |
          foreach ($continue in @($false,$true)) {
            $folder = Join-Path $env:RUNNER_TEMP ("DomainConsole-failure-" + $continue)
            New-Item $folder -ItemType Directory -Force | Out-Null
            $job = @{Id=[guid]::NewGuid().ToString(); MicrosoftSource=$false; AutoReboot=$false; ContinueOnError=$continue; Steps=@(@{Name='Failure fixture';Kind='CMD';Code='exit /b 7'},@{Name='Next step';Kind='CMD';Code='exit /b 0'})}
            $job | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $folder 'job.json') -Encoding utf8
            & ./Publish/Agent/DomainConsole.Agent.exe run $folder
            if ($LASTEXITCODE -ne 0) { throw 'Executor failed unexpectedly' }
            $state = Get-Content (Join-Path $folder 'status.json') -Raw | ConvertFrom-Json
            $expected = if ($continue) { 'CompletedWithErrors' } else { 'Failed' }
            if ($state.Status -ne $expected -or !$state.Ended -or $state.Results[0].ExitCode -ne 7 -or $state.Error -notmatch '0x00000007') { throw 'Failure status/code/diagnosis was not saved' }
          }
          Write-Output 'Nonzero command exit is terminal; continue-on-error preserves failure diagnosis.'
      - name: Verify native program exit capture in PowerShell
        shell: pwsh
        run: |
          $folder=Join-Path $env:RUNNER_TEMP 'native-exit-fixture'
          New-Item $folder -ItemType Directory -Force|Out-Null
          @{Id=[guid]::NewGuid().ToString();MicrosoftSource=$false;AutoReboot=$false;Steps=@(@{Name='Native exit';Kind='PowerShell';Code='cmd.exe /c exit 5; Write-Output "script completed"'})}|ConvertTo-Json -Depth 10|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
          & ./Publish/Agent/DomainConsole.Agent.exe run $folder
          $state=Get-Content (Join-Path $folder 'status.json') -Raw|ConvertFrom-Json
          if($state.Results[0].ExitCode -ne 0 -or $state.Results[0].NativeExitCode -ne 5){throw 'PowerShell and native exit codes were mixed or lost'}
      - name: Verify window and history after restart
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_UI_SMOKE = '1'
          $env:TEMP = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $env:TMP = $env:TEMP
          New-Item $env:TEMP -ItemType Directory -Force | Out-Null
          function Test-Window {
            $p = Start-Process ./Publish/DomainConsole.exe -PassThru
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) { if (Test-Path Publish/smoke-error.txt) { Get-Content Publish/smoke-error.txt }; throw "Application exited during startup: $($p.ExitCode)" }
            if ($p.MainWindowHandle -eq 0) { Stop-Process -Id $p.Id; throw "Application window was not created" }
            Write-Output "Window created: $($p.MainWindowTitle)"
            $null = $p.CloseMainWindow()
            if (!$p.WaitForExit(10000)) { Stop-Process -Id $p.Id; throw "Application did not close normally" }
            if ($p.ExitCode -ne 0) { throw "Application exited with code $($p.ExitCode)" }
          }
          Test-Window
          $env:DOMAINCONSOLE_EXPECT_HISTORY = '1'
          Test-Window
          Remove-Item Publish/Data -Recurse -Force
          Write-Output "History persisted, opened without network, and survived AD list refresh."
      - name: Verify diagnostic script and time window
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'DomainConsole-diagnostic-window'
          New-Item (Join-Path $fixture 'Logs/CBS') -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $fixture 'Logs/DISM') -ItemType Directory -Force | Out-Null
          $jobFolder = Join-Path $fixture 'DomainConsoleCSharp/00000000-0000-0000-0000-000000000001'
          New-Item $jobFolder -ItemType Directory -Force | Out-Null
          @{Started=[DateTime]::UtcNow.AddMinutes(-10).ToString('o');Status='Failed';Ended=[DateTime]::UtcNow.ToString('o');Error='fixture failure';Results=@()} | ConvertTo-Json | Set-Content (Join-Path $jobFolder 'status.json') -Encoding utf8
          $old = (Get-Date).AddDays(-3).ToString('yyyy-MM-dd HH:mm:ss') + ', Error OUTSIDE_WINDOW_ERROR'
          $recent = (Get-Date).AddMinutes(-5).ToString('yyyy-MM-dd HH:mm:ss') + ', Error IN_WINDOW_ERROR'
          (@($old,$recent,'Continuation context') + @(1..10 | ForEach-Object { (Get-Date).AddMinutes(-4).ToString('yyyy-MM-dd HH:mm:ss')+', Info ordinary context' }) + @((Get-Date).AddMinutes(-4).ToString('yyyy-MM-dd HH:mm:ss')+', Info NORMAL_CBS_NOT_FOR_DISPLAY')) | Set-Content (Join-Path $fixture 'Logs/CBS/CBS.log') -Encoding utf8
          $script = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/diagnostic-script.ps1'
          $text = Get-Content $script -Raw
          $harness = @'
          $ErrorActionPreference='Stop'
          $tokens=$null;$parseErrors=$null
          $text=[IO.File]::ReadAllText($env:DOMAINCONSOLE_DIAGNOSTIC_SCRIPT)
          $null=[Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count){throw ($parseErrors|Out-String)}
          function Get-Process {param($Name,$ErrorAction) @()}
          function Get-WinEvent {param($FilterHashtable,$MaxEvents,$ErrorAction) @()}
          $env:windir=$env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE
          $env:ProgramData=$env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE
          $result=(& ([ScriptBlock]::Create($text)))|Out-String
          if($result -notmatch 'IN_WINDOW_ERROR' -or $result -match 'OUTSIDE_WINDOW_ERROR' -or $result -notmatch 'Continuation context'){throw 'Time-window/context filter failed'}
          if($result -match 'NORMAL_CBS_NOT_FOR_DISPLAY'){throw 'Full CBS leaked into short diagnostic output'}
          Write-Output 'Diagnostic script valid in Windows PowerShell 5.1; selected interval and context verified.'
          '@
          $env:DOMAINCONSOLE_DIAGNOSTIC_SCRIPT=$script
          $env:DOMAINCONSOLE_DIAGNOSTIC_FIXTURE=$fixture
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($harness)))
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic script check failed' }
      - name: Verify reporting scripts in Windows PowerShell
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_REPORT_SCRIPTS = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $check = @'
          foreach($name in @('delivery-client.ps1','delivery-server.ps1','report-recovery.ps1','cache-cleanup.ps1','force-update.ps1','defender-diagnose.ps1','defender-recover.ps1','live-updates.ps1')){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS $name),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
          Write-Output 'Reporting scripts parse in Windows PowerShell 5.1.'
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check)))
          if ($LASTEXITCODE -ne 0) { throw 'Reporting script parsing failed' }
      - name: Verify legacy MRT force selection guards
        shell: powershell
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'force-selection-fixture'
          New-Item $p -ItemType Directory -Force|Out-Null
          $body=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/force-update-select.ps1'))
          $script=[ScriptBlock]::Create($body)
          $start=[DateTime]::UtcNow.AddMinutes(-10)
          $mrt=[pscustomobject]@{Name='MRT.exe';ProcessId=100;ParentProcessId=200;CreationDate=$start.AddSeconds(5);CommandLine='MRT.exe'}
          $installer=[pscustomobject]@{Name='Windows-KB890830-x64-test.exe';ProcessId=200;ParentProcessId=300;CreationDate=$start.AddSeconds(-2);CommandLine=('"'+(Join-Path $env:windir 'SoftwareDistribution\Download\Install\Windows-KB890830-x64-test.exe')+'" /Q /W')}
          $script:fixtureProcesses=@($mrt,$installer)
          function Get-CimInstance {param($ClassName) $script:fixtureProcesses}
          $state=@{Stage=([Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('IwRBBEIEMAQ9BD4EMgQ6BDAEIAC3ACAASwBCADgAOQAwADgAMwAwAA==')));StageStarted=$start.ToString('o');Started=$start.AddMinutes(-1).ToString('o');Ended=''}
          $state|ConvertTo-Json|Set-Content (Join-Path $p 'status.json') -Encoding UTF8
          . $script
          if($plan.MrtPid -ne 100 -or $plan.InstallerPid -ne 200){throw 'Valid legacy MRT chain not selected'}
          function Expect-Rejected { $rejected=$false;try{. $script}catch{$rejected=$true};if(!$rejected){throw 'Unsafe candidate accepted'} }
          $mrt.ParentProcessId=999;Expect-Rejected;$mrt.ParentProcessId=200
          $mrt.CreationDate=$start.AddHours(-1);Expect-Rejected;$mrt.CreationDate=$start.AddSeconds(5)
          $installer.CommandLine='C:\Other\Windows-KB890830.exe';Expect-Rejected
          $installer.CommandLine=('"'+(Join-Path $env:windir 'SoftwareDistribution\Download\Install\Windows-KB890830-x64-test.exe')+'" /Q /W')
          $script:fixtureProcesses=@($mrt,$mrt,$installer);Expect-Rejected;$script:fixtureProcesses=@($mrt,$installer)
          $state.Ended=[DateTime]::UtcNow.ToString('o');$state|ConvertTo-Json|Set-Content (Join-Path $p 'status.json') -Encoding UTF8;Expect-Rejected
          Write-Output 'Legacy MRT chain selected; wrong parent, old process, foreign path, ambiguity and terminal job rejected. No processes killed.'
      - name: Verify live WSUS and Defender guards
        shell: pwsh
        run: |
          $scriptText=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/live-updates.ps1'))
          $scriptText=$scriptText.Replace("[bool](New-Object -ComObject Microsoft.Update.Installer).IsBusy",'$fixtureBusy')
          $scriptBlock=[ScriptBlock]::Create($scriptText)
          $fixture=Join-Path $env:RUNNER_TEMP 'live-update-fixture'
          $savedProgramData=$env:ProgramData;$env:ProgramData=$fixture
          $id=[guid]::NewGuid().ToString();$folder=Join-Path $fixture ('DomainConsoleCSharp/'+$id)
          New-Item $folder -ItemType Directory -Force|Out-Null
          @{OutputChannel='WSUS'}|ConvertTo-Json|Set-Content (Join-Path $folder 'job.json') -Encoding utf8
          @{Ended='';Status='Running'}|ConvertTo-Json|Set-Content (Join-Path $folder 'status.json') -Encoding utf8
          $fixtureBusy=$false;$fixtureProcesses=@()
          function Get-CimInstance {param($ClassName,$Filter) $fixtureProcesses}
          try {
            $result=(& $scriptBlock)|ConvertFrom-Json
            if($result.Busy -or $result.Jobs.Count){throw 'Dead historical job blocked execution'}
            $fixtureProcesses=@([pscustomobject]@{CommandLine=('agent.exe run "'+$folder+'"')})
            $result=(& $scriptBlock)|ConvertFrom-Json
            if($result.Jobs.Count -ne 1){throw 'Live WSUS executor not detected'}
            @{Ended=[DateTime]::UtcNow.ToString('o');Status='Failed';DiagnosticStatus='Completed'}|ConvertTo-Json|Set-Content (Join-Path $folder 'status.json') -Encoding utf8
            $result=(& $scriptBlock)|ConvertFrom-Json
            if($result.Jobs.Count){throw 'Finished job blocked execution'}
            $fixtureBusy=$true
            $recovery=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/defender-recover.ps1')).Replace('(New-Object -ComObject Microsoft.Update.Installer).IsBusy','$fixtureBusy')
            $blocked=$false;try{& ([ScriptBlock]::Create($recovery))}catch{$blocked=$true}
            if(!$blocked){throw 'Defender recovery ran during WUA installation'}
          }finally{$env:ProgramData=$savedProgramData}
      - name: Verify activity probe through a real WinRM session
        shell: pwsh
        run: |
          $code=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/live-updates.ps1'))
          if($code -match 'New-Object\s+-ComObject|Microsoft\.Update\.Installer'){throw 'Remote probe must not create WUA COM'}
          Enable-PSRemoting -SkipNetworkProfileCheck -Force
          $user='dcprobe'+([guid]::NewGuid().ToString('N').Substring(0,8))
          $password=ConvertTo-SecureString (([guid]::NewGuid().ToString('N'))+'A!9') -AsPlainText -Force
          $credential=[pscredential]::new(($env:COMPUTERNAME+'\'+$user),$password)
          $reg='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          $old=(Get-ItemProperty $reg).LocalAccountTokenFilterPolicy
          $trusted=(Get-Item WSMan:\localhost\Client\TrustedHosts).Value
          $session=$null
          try {
            New-LocalUser $user -Password $password -AccountNeverExpires|Out-Null
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-544').Name -Member $user
            New-ItemProperty $reg -Name LocalAccountTokenFilterPolicy -Value 1 -PropertyType DWord -Force|Out-Null
            Set-Item WSMan:\localhost\Client\TrustedHosts 'localhost' -Force
            $session=New-PSSession -ComputerName localhost -Credential $credential -Authentication Negotiate -ErrorAction Stop
            $result=Invoke-Command -Session $session -ScriptBlock {param($code);& ([ScriptBlock]::Create($code))} -ArgumentList $code -ErrorAction Stop
            $probe=$result|ConvertFrom-Json
            if($null -eq $probe.Jobs -or $probe.Busy){throw 'Unexpected remote activity result'}
            Write-Output 'Read-only activity probe completed through authenticated WinRM without WUA COM activation.'
          }finally{
            if($session){Remove-PSSession $session}
            Remove-LocalUser $user -ErrorAction SilentlyContinue
            if($null -eq $old){Remove-ItemProperty $reg -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue}else{Set-ItemProperty $reg -Name LocalAccountTokenFilterPolicy -Value $old}
            Set-Item WSMan:\localhost\Client\TrustedHosts $trusted -Force
          }
      - name: Verify cache cleanup protection and backup
        shell: pwsh
        run: |
          $fixture=Join-Path $env:RUNNER_TEMP 'DomainConsole-cache-fixture'
          $text=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke/cache-cleanup.ps1'))
          $text=$text.Replace('(New-Object -ComObject Microsoft.Update.Installer).IsBusy','$fixtureBusy')
          $oldWindir=$env:windir;$env:windir=$fixture
          $states=@{wuauserv='Running';bits='Running';cryptsvc='Stopped'};$fixtureBusy=$false;$failStop=$false
          function Get-Service($Name){$obj=[pscustomobject]@{Status=$states[$Name]};$obj|Add-Member ScriptMethod WaitForStatus {param($status,$timeout)};return $obj}
          function Stop-Service($Name){if($failStop -and $Name -eq 'bits'){throw 'fixture stop failure'};$states[$Name]='Stopped'}
          function Start-Service($Name){$states[$Name]='Running'}
          try {
            $download=Join-Path $fixture 'SoftwareDistribution/Download';New-Item $download -ItemType Directory -Force|Out-Null
            Set-Content (Join-Path $download 'sample.bin') 'fixture'
            $fixtureBusy=$true;$rejected=$false
            try{& ([ScriptBlock]::Create($text))}catch{$rejected=$true}
            if(!$rejected -or !(Test-Path (Join-Path $download 'sample.bin'))){throw 'Busy installer protection failed'}
            $fixtureBusy=$false;$failStop=$true;$rejected=$false
            try{& ([ScriptBlock]::Create($text))}catch{$rejected=$true}
            if(!$rejected -or $states.wuauserv -ne 'Running' -or !(Test-Path $download)){throw 'Stop failure restoration failed'}
            $failStop=$false
            & ([ScriptBlock]::Create($text.Replace('$backup=$false','$backup=$true')))
            if(Test-Path $download){throw 'Backup mode did not move cache'}
            if(!(Get-ChildItem (Split-Path $download) -Filter 'Download.DomainConsoleBackup_*')){throw 'Backup missing'}
            if($states.wuauserv -ne 'Running' -or $states.bits -ne 'Running'){throw 'Service restoration failed'}
          } finally {$env:windir=$oldWindir}
      - name: Verify report queue recovery
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_REPORT_SCRIPTS = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $check = @'
          $ErrorActionPreference='Stop'
          $text=[IO.File]::ReadAllText((Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS 'report-recovery.ps1'))
          $text=$text.Replace('$keepBackup=$false;','')
          function New-Object {param($ComObject) if($ComObject -ne 'Microsoft.Update.Installer'){throw 'Unexpected COM'};[pscustomobject]@{IsBusy=$script:busy}}
          function Get-Service {param($Name) $s=[pscustomobject]@{Status=$script:service};$s|Add-Member ScriptMethod WaitForStatus {param($state,$timeout) if($script:service -ne $state){throw 'Service state mismatch'}};$s}
          function Stop-Service {param($Name,$ErrorAction) $script:service='Stopped'}
          function Start-Service {param($Name,$ErrorAction) if($script:restartFail){throw 'Restart fixture failure'};$script:service='Running'}
          foreach($mode in @('delete','backup','busy','restart-failure')){
            $fixture=Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS ('recovery-'+$mode)
            $env:windir=$fixture;$env:ProgramData=$fixture
            $source=Join-Path $fixture 'SoftwareDistribution/EventCache.v2'
            $null=[IO.Directory]::CreateDirectory($source)
            $null=[IO.Directory]::CreateDirectory((Join-Path $fixture 'DomainConsoleCSharp'))
            [IO.File]::WriteAllText((Join-Path $source 'event.bin'),'KEEP_FOR_BACKUP')
            $script:service='Running';$script:busy=$mode -eq 'busy';$script:restartFail=$mode -eq 'restart-failure';$keepBackup=$mode -eq 'backup';$failed=$false
            try {$null=& ([ScriptBlock]::Create($text))}catch{$failed=$true}
            $copies=@(Get-ChildItem (Join-Path $fixture 'DomainConsoleCSharp') -Directory -Filter 'ReportQueue_*')
            if($mode -eq 'delete' -and ((Test-Path $source) -or $copies.Count -or $failed -or $script:service -ne 'Running')){throw 'Delete recovery failed'}
            if($mode -eq 'backup' -and ($copies.Count -ne 1 -or $failed -or !(Test-Path (Join-Path $copies[0].FullName 'event.bin')))){throw 'Backup recovery failed'}
            if($mode -eq 'busy' -and (!$failed -or !(Test-Path (Join-Path $source 'event.bin')))){throw 'Busy installer protection failed'}
            if($mode -eq 'restart-failure' -and (!$failed -or $copies.Count -ne 1 -or !(Test-Path (Join-Path $copies[0].FullName 'event.bin')))){throw 'Recovery data lost on restart failure'}
          }
          Write-Output 'Recovery deletion, optional backup, busy installer guard and restart failure preservation verified.'
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check)))
          if ($LASTEXITCODE -ne 0) { throw 'Queue recovery verification failed' }
      - name: Verify reading live IIS journal
        shell: pwsh
        run: |
          $env:DOMAINCONSOLE_REPORT_SCRIPTS = Join-Path $env:RUNNER_TEMP 'DomainConsole-smoke'
          $check = @'
          $ErrorActionPreference='Stop'
          $text=[IO.File]::ReadAllText((Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS 'delivery-server.ps1'))
          $begin=$text.IndexOf(' $watch=')
          $end=$text.IndexOf([char]10+'}catch',$begin)
          if($begin -lt 0 -or $end -lt 0){throw 'IIS parser fixture extraction failed'}
          $code=$text.Substring($begin,$end-$begin)
          $path=Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS 'live-iis.log'
          $stamp=[DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss')
          [IO.File]::WriteAllText($path,("#Fields: date time c-ip cs-method cs-uri-stem sc-status sc-substatus sc-win32-status time-taken"+[Environment]::NewLine+$stamp+" 10.1.1.1 POST /ReportingWebService/ReportingWebService.asmx 200 0 0 75"+[Environment]::NewLine+$stamp+" 10.1.1.2 POST /ReportingWebService/ReportingWebService.asmx 500 0 0 20"))
          # Large unrelated traffic reproduces the production timeout; C# filtering must remain fast.
          $filler=$stamp+' 10.1.1.99 GET /Content/large.cab 206 0 0 5'+[Environment]::NewLine
          [IO.File]::AppendAllText($path,[Environment]::NewLine+($filler * 350000))
          $writer=[IO.File]::Open($path,[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::ReadWrite)
          try {
            $files=@(Get-Item $path);$ips=@('10.1.1.1');$since=[DateTime]::UtcNow.AddMinutes(-1);$until=[DateTime]::UtcNow.AddMinutes(1)
            $result=@{Complete=$true;Error='';Requests=@();IisRead=$false}
            $elapsed=[Diagnostics.Stopwatch]::StartNew();$null=& ([ScriptBlock]::Create($code));if($elapsed.Elapsed.TotalSeconds -gt 30){throw 'Large IIS fixture was not read efficiently'}
            if(!$result.IisRead -or $result.Requests.Count -ne 1 -or $result.Requests[0].Status -ne 200){throw 'Live log reading or client filtering failed'}
          }finally{$writer.Dispose()}
          $named=Join-Path $env:DOMAINCONSOLE_REPORT_SCRIPTS ('u_ex'+[DateTime]::UtcNow.ToString('yyMMdd')+'.log')
          Copy-Item $path $named
          (Get-Item $named).LastWriteTimeUtc=[DateTime]::UtcNow.AddDays(-3)
          $log=$env:DOMAINCONSOLE_REPORT_SCRIPTS
          $a=$text.IndexOf(' $allFiles=');$b=$text.IndexOf(' if(!$site.LogFile.Enabled)', $a)
          if($a -lt 0 -or $b -lt 0){throw 'IIS selection extraction failed'}
          $null=. ([ScriptBlock]::Create($text.Substring($a,$b-$a)))
          if(!@($files|Where-Object {$_.FullName -eq $named}).Count){throw 'Active date-named IIS file was skipped because of old file timestamp'}
          $exclusive=[IO.File]::Open($path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::None);$exclusive.Dispose()
          Write-Output 'Large live IIS snapshot, client filtering and reader disposal verified.'
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check)))
          if ($LASTEXITCODE -ne 0) { throw 'Live IIS journal test failed' }
      - name: Save portable package
        uses: actions/upload-artifact@v4
        with:
          name: DomainConsole-Windows-x64
          path: Publish/
          if-no-files-found: error
      - name: Save UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DomainConsole-UI-review
          path: ${{ runner.temp }}/DomainConsole-smoke/ui-*.png
          if-no-files-found: warn

